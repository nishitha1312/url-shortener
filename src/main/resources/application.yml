spring:
  application:
    name: url-shortener

  # ── PostgreSQL (default) ──────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/urlshortener}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  # ── JPA ──────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 50
        order_inserts: true

  # ── Redis ─────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

# ── App Settings ──────────────────────────────────────
app:
  base-url: ${BASE_URL:http://localhost:8080}
  default-expiry-days: ${DEFAULT_EXPIRY_DAYS:30}
  cleanup-interval-ms: ${CLEANUP_INTERVAL_MS:3600000}  # 1 hour
  cache:
    ttl-seconds: ${CACHE_TTL:300}  # 5 minutes

# ── Actuator / Observability ──────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

# ── Swagger UI ────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs

# ── Logging ───────────────────────────────────────────
logging:
  level:
    com.urlshortener: INFO
    org.springframework.cache: DEBUG

server:
  port: ${PORT:8080}
  compression:
    enabled: true
